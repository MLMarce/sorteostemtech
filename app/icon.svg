<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#060A10"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Glow layer -->
  <rect width="32" height="32" rx="7" fill="url(#glow)"/>

  <!-- Border -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.5" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Ticket / star shape in the center -->
  <!-- Horizontal bar of T (top) -->
  <rect x="7" y="9" width="18" height="3.5" rx="1.5" fill="url(#star)"/>

  <!-- Vertical bar of T -->
  <rect x="13.25" y="12.5" width="5.5" height="11" rx="1.5" fill="url(#star)"/>

  <!-- Small corner accent dots -->
  <circle cx="5.5" cy="5.5" r="1" fill="#00E5FF" fill-opacity="0.5"/>
  <circle cx="26.5" cy="5.5" r="1" fill="#00E5FF" fill-opacity="0.5"/>
  <circle cx="5.5" cy="26.5" r="1" fill="#7C3AED" fill-opacity="0.5"/>
  <circle cx="26.5" cy="26.5" r="1" fill="#7C3AED" fill-opacity="0.5"/>
</svg>
